<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <form>
                <h1>Sign In</h1>
                <a href="https://www.example.com">or create an account</a>
                <br><br>
                <input type="text" class="username" placeholder="Email">
                <br><br>
                <input type="password" class="password" placeholder="Password">
                <br><br>
                <a href="https://www.example.com">Forgot your password?</a>
                <br><br>
                <button class="SignInButton">Sign In</button>
            </form>


        </div>
    </div>
</body>
</body>
</html>
